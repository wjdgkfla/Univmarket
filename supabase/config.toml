# Local and preview-environment configuration for UnivMarket.
# Production remains project amzvnsphtaxkjzmsjsie; no secrets belong here.
project_id = "univmarket"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Require migrations to grant Data API access explicitly.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Production records must never be copied into preview databases.
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "com.univmarket.app://auth-callback/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = true
port = 54327
backend = "postgres"

# The gateway JWT check is off because the caller is pg_cron, not a user;
# the function authorizes each run with the Vault token instead.
[functions.cleanup-listing-photos]
verify_jwt = false

# Called by the reports insert trigger via pg_net, not by users; the
# function authorizes each call with the Vault token instead.
[functions.notify-new-report]
verify_jwt = false

# Called by the notifications insert trigger via pg_net with a Vault token.
[functions.send-push]
verify_jwt = false
